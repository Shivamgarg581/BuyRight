name: Sync official prices
on:
  schedule:
    - cron: "20 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser
        run: python -m pip install requests beautifulsoup4
      - name: Fetch and validate Consumer Affairs data
        run: python scripts/sync_official.py
      - name: Commit official snapshot and history
        run: |
          git config user.name "buyright-data"
          git config user.email "actions@users.noreply.github.com"
          git add data/official-prices.json data/price-history.json
          git diff --cached --quiet || git commit -m "data: sync official price observations"
          git push
