name: Validate BuyRight
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON datasets
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('data').glob('*.json'):
              json.loads(p.read_text())
              print('valid json:', p)
          PY
      - name: Validate official dataset minimum
        run: |
          python - <<'PY'
          import json
          d=json.load(open('data/official-prices.json'))
          assert d.get('source')
          assert d.get('observedOn')
          assert len(d.get('retail',{})) >= 10
          print('official records:', len(d['retail']))
          PY
      - name: Validate JavaScript in HTML
        run: |
          python - <<'PY' > /tmp/app.js
          import re
          s=open('index.html',encoding='utf-8').read()
          blocks=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          assert blocks, 'no inline script found'
          print('\\n'.join(blocks))
          PY
          node --check /tmp/app.js
      - name: Check for obvious committed secrets
        run: |
          ! grep -RInE '(sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|ghp_[0-9A-Za-z]{20,})' . --exclude-dir=.git
